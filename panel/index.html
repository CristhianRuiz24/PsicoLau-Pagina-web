<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Panel - PsicoLau</title>
  <link rel="stylesheet" href="panel.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="font-size: 2.2rem; color: var(--rosa-coral); margin-bottom: 0.5rem;"><i class="fa-solid fa-brain"></i></div>
      <h1>PsicoLau Panel</h1>
      <p>Gestión de agenda y consultorio clínico</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope" style="color: var(--turquesa); margin-right: 4px;"></i> Correo o usuario</label>
          <input type="text" id="email" required placeholder="laura@psicolau.com o admin">
        </div>
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock" style="color: var(--turquesa); margin-right: 4px;"></i> Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket" style="margin-right: 6px;"></i> Ingresar al Panel</button>
        <p class="error-message" id="errorMessage">Credenciales inválidas.</p>
      </form>
    </div>
  </div>

  <script src="panel.js"></script>
  <script>
    // Redirigir si ya hay un token
    if (localStorage.getItem('psicolau_token')) {
      window.location.href = 'agenda.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const btn = document.getElementById('loginBtn');
      
      errorMsg.style.display = 'none';
      btn.innerText = 'Autenticando...';
      btn.disabled = true;

      try {
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:' || !window.location.hostname)
          ? 'http://localhost:3000/api'
          : (window.PSICOLAU_API_URL || 'https://api.psicolau.com/api');

        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success && data.token) {
          localStorage.setItem('psicolau_token', data.token);
          window.location.href = 'agenda.html';
        } else {
          throw new Error(data.message || 'Error de autenticación');
        }
      } catch (error) {
        errorMsg.innerText = error.message;
        errorMsg.style.display = 'block';
        btn.innerText = 'Ingresar';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
