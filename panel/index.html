<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso Panel - PsicoLau</title>
  <link rel="stylesheet" href="/panel/css/panel.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="font-size: 2.2rem; color: var(--rosa-coral); margin-bottom: 0.5rem;"><i class="fa-solid fa-brain"></i></div>
      <h1>PsicoLau Panel</h1>
      <p>Gestión de agenda y consultorio clínico</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope" style="color: var(--turquesa); margin-right: 4px;"></i> Usuario o Correo</label>
          <input type="text" id="email" required placeholder="contacto@psicolau.com">
        </div>
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock" style="color: var(--turquesa); margin-right: 4px;"></i> Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket" style="margin-right: 6px;"></i> Ingresar al Panel</button>
        <p class="error-message" id="errorMessage">Credenciales inválidas.</p>
      </form>
    </div>
  </div>

  <script src="/panel/js/config.js"></script>
  <script src="/panel/js/login.js"></script>
</body>
</html>
