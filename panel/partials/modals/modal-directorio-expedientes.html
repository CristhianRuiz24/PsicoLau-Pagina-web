<!-- Modal / Directorio General de Expedientes Clínicos -->
  <div id="modalDirectorioExpedientes" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 1rem;">
    <div style="background: #ffffff; padding: 1.8rem; border-radius: 14px; width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,0.25);">
      <!-- Cabecera del Directorio -->
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.8rem;">
        <div>
          <h3 style="color: var(--rosa-coral); font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-folder-open" style="color: var(--rosa-coral);"></i> Directorio de Expedientes Clínicos
          </h3>
          <p style="font-size: 0.84rem; color: #64748b; margin: 0.25rem 0 0 0;">Acceso confidencial al historial de sesiones de cada paciente</p>
        </div>
        <button type="button" class="btn-close-modal" onclick="cerrarDirectorioExpedientes()" title="Cerrar modal">&times;</button>
      </div>

      <!-- Barra de Búsqueda Rápida en Directorio -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center;">
        <div style="position: relative; flex: 1;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem;"></i>
          <input type="text" id="busquedaDirectorioInput" placeholder="Buscar paciente por nombre, teléfono o correo..." oninput="filtrarDirectorioExpedientes(this.value)" autocomplete="off" style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 2.2rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.92rem; outline: none;">
        </div>
        <span id="directorioTotalPacientes" style="font-size: 0.8rem; font-weight: 700; background: #f1f5f9; color: #475569; padding: 0.5rem 0.8rem; border-radius: 6px; white-space: nowrap;">0 pacientes</span>
      </div>

      <!-- Lista de Pacientes -->
      <div id="directorioPacientesLista" style="flex: 1; overflow-y: auto; padding-right: 4px; min-height: 240px; display: flex; flex-direction: column; gap: 0.6rem;">
        <!-- Se genera dinámicamente -->
      </div>

      <!-- Pie del Modal -->
      <div style="display: flex; justify-content: flex-end; align-items: center; padding-top: 0.8rem; border-top: 1px solid #f1f5f9; margin-top: 0.8rem;">
        <button type="button" class="btn" style="background: var(--gris-calido); width: auto; padding: 0.5rem 1.4rem;" onclick="cerrarDirectorioExpedientes()">Cerrar</button>
      </div>
    </div>
  </div>
