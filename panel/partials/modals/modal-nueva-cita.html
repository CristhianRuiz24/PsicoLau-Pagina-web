<!-- Modal para Nueva / Editar Cita y Bloqueos -->
  <div id="modalNuevaCita" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 1rem;">
    <div style="background: white; padding: 1.8rem; border-radius: 14px; width: 100%; max-width: 480px; max-height: 94vh; overflow-y: auto; box-shadow: 0 16px 40px rgba(0,0,0,0.25);">
      <!-- Cabecera del Modal -->
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; gap: 0.8rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.8rem;">
        <div style="flex: 1; min-width: 0;">
          <h3 id="modalTitulo" style="color: var(--rosa-coral); font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
            <i class="fa-solid fa-calendar-plus"></i>
            <span>Agendar Cita</span>
          </h3>
          <div id="modalSubtitulo" style="display: none; margin-top: 5px;"></div>
        </div>
        <button type="button" onclick="cerrarModal()" class="btn-close-modal" title="Cerrar modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Selector de Tipo de Registro: Cita Individual vs Evaluación vs Terapia Grupal vs Bloqueo Personal -->
      <div id="seccionTabsTipo" class="event-type-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap;">
        <button type="button" id="tabTipoCita" class="tab-btn active" onclick="seleccionarTipoRegistro('CITA')" style="flex: 1; min-width: 105px;">
          <i class="fa-solid fa-user-doctor"></i> Cita Individual
        </button>
        <button type="button" id="tabTipoEvaluacion" class="tab-btn" onclick="seleccionarTipoRegistro('EVALUACION')" style="flex: 1; min-width: 105px;">
          <i class="fa-solid fa-brain"></i> Evaluación
        </button>
        <button type="button" id="tabTipoGrupal" class="tab-btn" onclick="seleccionarTipoRegistro('GRUPAL')" style="flex: 1; min-width: 105px;">
          <i class="fa-solid fa-people-group"></i> Terapia Grupal
        </button>
        <button type="button" id="tabTipoBloqueo" class="tab-btn" onclick="seleccionarTipoRegistro('BLOQUEO')" style="flex: 1; min-width: 105px;">
          <i class="fa-solid fa-ban"></i> Bloquear Horario
        </button>
      </div>

      <form id="formNuevaCita">
        <input type="hidden" id="nc_id">

        <!-- Campo de Nombre / Motivo / Tipo de Grupo -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label id="lblNombre" for="nc_nombre" style="margin: 0; font-weight: 500;">
              <i class="fa-solid fa-user" style="color: var(--turquesa); margin-right: 4px;"></i> Nombre del paciente / Asunto *
            </label>
            <span id="badgePacienteDetectado" style="display: none; font-size: 0.72rem; padding: 2px 8px; background: #dcfce7; color: #15803d; border-radius: 999px; font-weight: 600;">
              <i class="fa-solid fa-circle-check"></i> Paciente registrado
            </span>
          </div>
          <input type="text" id="nc_nombre" required placeholder="Escribe el nombre del paciente..." oninput="manejarInputNombrePaciente(this.value)" onchange="manejarInputNombrePaciente(this.value)" autocomplete="off">
        </div>

        <!-- Campos de Contacto Individual (Ocultos si es Grupal o Bloqueo) -->
        <div id="camposContactoIndividual" style="display: grid; grid-template-columns: 1fr 1.25fr; gap: 0.8rem; margin-bottom: 0.4rem;">
          <div class="form-group">
            <label for="nc_email"><i class="fa-solid fa-envelope" style="color: var(--turquesa); margin-right: 4px;"></i> Correo Electrónico <span style="font-size: 0.8rem; color: #64748b; font-weight: normal;">(opcional)</span></label>
            <input type="email" id="nc_email" placeholder="correo@ejemplo.com (opcional)" autocomplete="off" style="width: 100%; text-overflow: ellipsis;">
          </div>
          <div class="form-group">
            <label for="nc_telefono"><i class="fa-brands fa-whatsapp" style="color: #16a34a; margin-right: 4px;"></i> WhatsApp / Teléfono <span style="font-size: 0.8rem; color: #64748b; font-weight: normal;">(opcional)</span></label>
            <div style="display: flex; gap: 0.35rem;">
              <select id="nc_prefijo" onchange="actualizarPlaceholderTelefono(this.value)" style="width: 95px; padding: 0.72rem 0.3rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.84rem; background: #f8fafc; font-weight: 600; cursor: pointer; flex-shrink: 0;">
                <option value="+52" selected>🇲🇽 +52</option>
                <option value="+1">🇺🇸/🇨🇦 +1</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+57">🇨🇴 +57</option>
                <option value="+54">🇦🇷 +54</option>
                <option value="+56">🇨🇱 +56</option>
                <option value="+51">🇵🇪 +51</option>
                <option value="+593">🇪🇨 +593</option>
                <option value="+502">🇬🇹 +502</option>
                <option value="+506">🇨🇷 +506</option>
                <option value="+503">🇸🇻 +503</option>
                <option value="+504">🇭🇳 +504</option>
                <option value="+505">🇳🇮 +505</option>
                <option value="+507">🇵🇦 +507</option>
                <option value="+598">🇺🇾 +598</option>
                <option value="+58">🇻🇪 +58</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+39">🇮🇹 +39</option>
                <option value="+41">🇨🇭 +41</option>
                <option value="">🌐 Otro</option>
              </select>
              <input type="tel" id="nc_telefono" placeholder="Número de WhatsApp (opcional)" autocomplete="off" style="flex: 1; min-width: 0; padding: 0.72rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.92rem;">
            </div>
          </div>
        </div>

        <!-- Enlace de Zoom (Visible para Citas Individuales y Terapias Grupales) -->
        <div id="campoZoomContainer" class="form-group" style="margin-top: 0.2rem; margin-bottom: 0.8rem;">
          <label id="lblZoom" for="nc_enlace_zoom"><i class="fa-solid fa-video" style="color: #2563eb; margin-right: 4px;"></i> Enlace personal de Zoom / Videollamada (opcional)</label>
          <input type="text" id="nc_enlace_zoom" placeholder="https://zoom.us/j/... o Google Meet" style="width: 100%;">
        </div>

        <!-- Fecha y Hora -->
        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 0.8rem; margin-bottom: 0.8rem;">
          <div>
            <label style="display: block; margin-bottom: 0.4rem; font-weight: 500;"><i class="fa-solid fa-calendar" style="color: var(--turquesa); margin-right: 4px;"></i> Fecha *</label>
            <input type="date" id="nc_fecha" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem;">
          </div>
          <div>
            <label style="display: block; margin-bottom: 0.4rem; font-weight: 500;"><i class="fa-solid fa-clock" style="color: var(--turquesa); margin-right: 4px;"></i> Hora *</label>
            <select id="nc_hora" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; background: #ffffff; cursor: pointer;">
              <option value="07:00">07:00 a.m.</option>
              <option value="07:30">07:30 a.m.</option>
              <option value="08:00">08:00 a.m.</option>
              <option value="08:30">08:30 a.m.</option>
              <option value="09:00">09:00 a.m.</option>
              <option value="09:30">09:30 a.m.</option>
              <option value="10:00">10:00 a.m.</option>
              <option value="10:30">10:30 a.m.</option>
              <option value="11:00">11:00 a.m.</option>
              <option value="11:30">11:30 a.m.</option>
              <option value="12:00">12:00 p.m.</option>
              <option value="12:30">12:30 p.m.</option>
              <option value="13:00">01:00 p.m.</option>
              <option value="13:30">01:30 p.m.</option>
              <option value="14:00">02:00 p.m.</option>
              <option value="14:30">02:30 p.m.</option>
              <option value="15:00">03:00 p.m.</option>
              <option value="15:30">03:30 p.m.</option>
              <option value="16:00">04:00 p.m.</option>
              <option value="16:30">04:30 p.m.</option>
              <option value="17:00">05:00 p.m.</option>
              <option value="17:30">05:30 p.m.</option>
              <option value="18:00">06:00 p.m.</option>
              <option value="18:30">06:30 p.m.</option>
              <option value="19:00">07:00 p.m.</option>
              <option value="19:30">07:30 p.m.</option>
              <option value="20:00">08:00 p.m.</option>
              <option value="20:30">08:30 p.m.</option>
              <option value="21:00">09:00 p.m.</option>
              <option value="21:30">09:30 p.m.</option>
              <option value="22:00">10:00 p.m.</option>
              <option value="22:30">10:30 p.m.</option>
              <option value="23:00">11:00 p.m.</option>
              <option value="23:30">11:30 p.m.</option>
              <option value="00:00">12:00 a.m. (Medianoche)</option>
            </select>
          </div>
        </div>

        <!-- Monto / Tarifa por Sesión -->
        <div id="seccionMontoSesion" class="form-group" style="margin-bottom: 0.8rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="nc_monto" style="margin: 0; font-weight: 500;">
              <i class="fa-solid fa-coins" style="color: #eab308; margin-right: 4px;"></i> Tarifa / Monto de la sesión ($ MXN) *
            </label>
            <button type="button" class="btn-quick-cortesia" onclick="establecerMontoCortesia()" style="font-size: 0.75rem; padding: 2px 8px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; color: #475569; font-weight: 600;">
              <i class="fa-solid fa-gift" style="color: var(--rosa-coral);"></i> $0 Cortesía
            </button>
          </div>

          <!-- Calculadora Grupal (Visible solo en Terapia Grupal) -->
          <div id="calculadoraGrupal" style="display: none; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.65rem;">
            <div style="font-size: 0.8rem; font-weight: 700; color: #6d28d9; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 5px;">
              <i class="fa-solid fa-calculator"></i> Calculadora de Ingreso Grupal
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
              <div>
                <label for="nc_cuota_persona" style="font-size: 0.76rem; font-weight: 600; color: #4b5563; display: block; margin-bottom: 0.2rem;">Cuota por persona ($):</label>
                <input type="number" id="nc_cuota_persona" step="any" min="0" value="150" placeholder="150" oninput="calcularTotalGrupal()" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; font-weight: 600;">
              </div>
              <div>
                <label for="nc_num_participantes" style="font-size: 0.76rem; font-weight: 600; color: #4b5563; display: block; margin-bottom: 0.2rem;">N° participantes:</label>
                <input type="number" id="nc_num_participantes" step="1" min="1" placeholder="6" oninput="calcularTotalGrupal()" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; font-weight: 600;">
              </div>
            </div>
            <small style="color: #7c3aed; font-size: 0.72rem; display: block; margin-top: 0.35rem;">
              Calcula el monto total automáticamente (cuota × participantes). También puedes ajustarlo a mano abajo.
            </small>
          </div>

          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <div style="position: relative; flex: 1;">
              <span style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); font-weight: 600; color: #64748b;">$</span>
              <input type="number" id="nc_monto" step="any" min="0" required placeholder="500.00" style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 1.8rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; font-weight: 600; color: #0f172a;">
            </div>
            <span style="font-size: 0.82rem; color: #64748b; font-weight: 600;">MXN</span>
          </div>
        </div>

        <!-- Notas / Observaciones -->
        <div class="form-group">
          <label for="nc_notas"><i class="fa-solid fa-comment-dots" style="color: var(--turquesa); margin-right: 4px;"></i> Notas / Observaciones (opcional)</label>
          <textarea id="nc_notas" rows="2" placeholder="Ej: cada 15 días, primera sesión, evaluación..." style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.9rem; resize: vertical;"></textarea>
        </div>

        <!-- Opciones de Citas Recurrentes (Solo al Crear Nueva Cita) -->
        <div id="seccionRecurrencia" class="form-group" style="background: #f8fafc; padding: 0.8rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1.2rem;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <label style="margin: 0; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
              <input type="checkbox" id="nc_repetir" onchange="toggleOpcionesRecurrencia(this.checked)" style="width: 16px; height: 16px; cursor: pointer;">
              <span><i class="fa-solid fa-repeat" style="color: var(--turquesa);"></i> Programar cita recurrente</span>
            </label>
          </div>

          <div id="opcionesRecurrenciaDetalle" style="display: none; margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px dashed #cbd5e1;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
              <div>
                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.2rem;">Frecuencia:</label>
                <select id="nc_frecuencia" style="width: 100%; padding: 0.45rem; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem;">
                  <option value="SEMANAL">Cada semana (7 días)</option>
                  <option value="QUINCENAL">Cada 15 días (quincenal)</option>
                </select>
              </div>
              <div>
                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.2rem;">Total de sesiones:</label>
                <select id="nc_repeticiones" style="width: 100%; padding: 0.45rem; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem;">
                  <option value="2">2 sesiones</option>
                  <option value="4" selected>4 sesiones (1 mes aprox.)</option>
                  <option value="8">8 sesiones (2 meses aprox.)</option>
                  <option value="12">12 sesiones (protocolo completo)</option>
                </select>
              </div>
            </div>
            <small style="color: #64748b; font-size: 0.75rem; display: block; margin-top: 0.4rem;">Se crearán las citas automáticamente en las semanas correspondientes.</small>
          </div>
        </div>

        <!-- Selector de Estado de Cita (Solo en Modo Edición) -->
        <div id="seccionEstadoCita" class="form-group" style="display: none; margin-bottom: 1.1rem;">
          <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.88rem; color: #334155;">
            <i class="fa-solid fa-traffic-light" style="color: var(--turquesa); margin-right: 4px;"></i> Estado de la sesión:
          </label>
          <div class="estado-cita-selector">
            <button type="button" class="btn-estado-opt active" data-estado="PENDIENTE" onclick="seleccionarEstadoModal('PENDIENTE')">
              <i class="fa-solid fa-clock"></i> <span>Pendiente</span>
            </button>
            <button type="button" class="btn-estado-opt" data-estado="REALIZADA" onclick="seleccionarEstadoModal('REALIZADA')">
              <i class="fa-solid fa-circle-check"></i> <span>Realizada</span>
            </button>
            <button type="button" class="btn-estado-opt" data-estado="CANCELADA" onclick="seleccionarEstadoModal('CANCELADA')">
              <i class="fa-solid fa-circle-xmark"></i> <span>Cancelada</span>
            </button>
          </div>
          <input type="hidden" id="nc_estado_cita" value="PENDIENTE">
        </div>

        <!-- Selector de Color (Easy Table Style) -->
        <div id="seccionColorBloque" class="form-group" style="margin-bottom: 1.3rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;"><i class="fa-solid fa-palette" style="color: var(--turquesa); margin-right: 4px;"></i> Color del bloque:</label>
          <div id="swatchesContainer" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
            <!-- Generado por JS -->
          </div>
          <input type="hidden" id="nc_color" value="#3EB8CC">
        </div>

        <div id="editExtraActions" style="display: none; margin-bottom: 1.2rem; text-align: right;">
          <button type="button" id="btnEliminarModal" onclick="eliminarCita(document.getElementById('nc_id')?.value, event)" style="background: none; border: none; color: #dc2626; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
            <i class="fa-solid fa-trash-can"></i> Eliminar esta cita
          </button>
        </div>

        <div id="modalFooterActions" style="display: flex; gap: 0.8rem;">
          <button type="submit" id="btnGuardarModal" class="btn" style="flex: 1.5;"><i class="fa-solid fa-check" style="margin-right: 4px;"></i> Confirmar y Guardar</button>
          <button type="button" id="btnCancelarModal" class="btn" style="flex: 1; background: var(--gris-calido);" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
